<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-wrapper">
        <h1>Student Registration</h1>
        <p class="subtitle">Create your account to enroll in the upcoming batch.</p>

        <form id="registrationForm" novalidate>
          <div class="form-grid">
            <div class="field-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" />
              <small class="error" id="fullNameError"></small>
            </div>

            <div class="field-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" />
              <small class="error" id="emailError"></small>
            </div>

            <div class="field-group">
              <label for="mobile">Mobile Number</label>
              <input type="tel" id="mobile" name="mobile" placeholder="9876543210" maxlength="10" />
              <small class="error" id="mobileError"></small>
            </div>

            <div class="field-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Create a strong password" />
              <div class="strength-meter" aria-live="polite">
                <span id="strengthBar"></span>
              </div>
              <small id="strengthText">Password strength: -</small>
              <small class="error" id="passwordError"></small>
            </div>

            <div class="field-group">
              <label for="confirmPassword">Confirm Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" />
              <small class="error" id="confirmPasswordError"></small>
            </div>

            <div class="field-group">
              <label for="course">Course</label>
              <select id="course" name="course">
                <option value="">Select your course</option>
                <option value="BCA">BCA</option>
                <option value="BSC-CS">B.Sc. Computer Science</option>
                <option value="BTech">B.Tech</option>
                <option value="MCA">MCA</option>
                <option value="Diploma">Diploma</option>
              </select>
              <small class="error" id="courseError"></small>
            </div>

            <div class="field-group">
              <label for="year">Year</label>
              <select id="year" name="year">
                <option value="">Select year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
              </select>
              <small class="error" id="yearError"></small>
            </div>

            <div class="field-group radio-group">
              <span class="label-title">Gender</span>
              <div class="radio-options">
                <label><input type="radio" name="gender" value="Male" /> Male</label>
                <label><input type="radio" name="gender" value="Female" /> Female</label>
                <label><input type="radio" name="gender" value="Other" /> Other</label>
              </div>
              <small class="error" id="genderError"></small>
            </div>
          </div>

          <div class="terms">
            <label class="checkbox-wrap">
              <input type="checkbox" id="terms" name="terms" />
              <span>I agree to the terms and conditions.</span>
            </label>
            <small class="error" id="termsError"></small>
          </div>

          <button type="submit" class="submit-btn">Register</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
